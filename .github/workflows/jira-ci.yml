name: Jira CI Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jira-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  jira-validation:
    name: Jira Ticket Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted base code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: pip install requests

      - name: Validate Jira Ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: python scripts/validate_jira.py


  code-validation:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q calculator.py

      - name: Run lint checks
        run: ruff check calculator.py tests/

      - name: Run unit tests
        run: python -m pytest tests/ -v


  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest

    needs:
      - jira-validation
      - code-validation

    if: always()

    steps:
      - name: Evaluate validation results
        env:
          JIRA_RESULT: ${{ needs.jira-validation.result }}
          CODE_RESULT: ${{ needs.code-validation.result }}
        run: |
          echo "Jira: $JIRA_RESULT"
          echo "Code: $CODE_RESULT"

          if [ "$JIRA_RESULT" != "success" ] || \
             [ "$CODE_RESULT" != "success" ]; then
            echo "CI Gate closed."
            exit 1
          fi

          echo "CI Gate open."


  pr-feedback:
    name: Post PR Feedback
    runs-on: ubuntu-latest

    needs:
      - jira-validation
      - code-validation
      - ci-gate

    if: always()

    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Post validation comment
        uses: actions/github-script@v7
        env:
          JIRA_RESULT: ${{ needs.jira-validation.result }}
          CODE_RESULT: ${{ needs.code-validation.result }}
          GATE_RESULT: ${{ needs.ci-gate.result }}
        with:
          script: |
            const passed =
              process.env.GATE_RESULT === "success";

            const result = status =>
              status === "success"
                ? "PASS"
                : status.toUpperCase();

            const message = [
              "<!-- jira-ci-feedback -->",
              "## Automated Jira CI Review",
              "",
              `Jira validation: ${result(process.env.JIRA_RESULT)}`,
              `Code validation: ${result(process.env.CODE_RESULT)}`,
              `CI Gate: ${passed ? "OPEN" : "CLOSED"}`,
              "",
              passed
                ? "All automated checks passed."
                : "@" + context.payload.pull_request.user.login +
                  " Please fix the failed checks before merging.",
              "",
              "[View detailed workflow logs](" +
                process.env.GITHUB_SERVER_URL + "/" +
                process.env.GITHUB_REPOSITORY +
                "/actions/runs/" +
                process.env.GITHUB_RUN_ID + ")"
            ].join("\n");

            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            };

            const comments = await github.paginate(
              github.rest.issues.listComments,
              params
            );

            const existing = comments.find(c =>
              c.user.login === "github-actions[bot]" &&
              c.body.startsWith("<!-- jira-ci-feedback -->")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                ...params,
                body: message
              });
            }
